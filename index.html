
<section class="room panel">
  <div class="room-heading">
    <div>
      <h2>♡ Mijn gezellige kamertje ♡</h2>
      <p>Welkom thuis, bestie!</p>
    </div>
    <div class="room-coins">
      🪙 <strong id="coins">100</strong>
    </div>
  </div>

  <div class="dream-room" id="dream-room">

    <div class="window">
      <div class="window-sky"></div>
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
    </div>

    <div class="wall-shelf shelf-left">
      🪴 🧸 📚
    </div>

    <div class="wall-shelf shelf-right">
      📚 🌸 🐱
    </div>

    <div class="bed furniture" data-furniture="bed">
      <div class="bed-head">♡</div>
      <div class="bed-pillow">🐰</div>
      <div class="bed-blanket"></div>
    </div>

    <div class="tv furniture" data-furniture="tv">
      <div class="tv-screen">♡</div>
      <div class="tv-stand"></div>
    </div>

    <div class="plant furniture" data-furniture="plant">
      🪴
    </div>

    <div class="rug"></div>

    <div id="pet" class="pet-character">
      🐰
    </div>

    <div id="speech" class="speech-bubble">
      Hoi! Wat gaan we doen? ♡
    </div>

    <div class="room-floor">
      <span>♡ Mijn kleine wereld ♡</span>
    </div>
  </div>

  <div class="room-actions">
    <button id="walk">🚶 Wandelen</button>
    <button id="sleep">🛏️ Slapen</button>
    <button id="talk">💬 Praten</button>
    <button id="decorate">🎀 Inrichten</button>
  </div>

  <div id="decoration-mode" hidden>
    <h3>Mijn meubels verplaatsen</h3>
    <p>Klik op een meubel en kies waar je het wilt neerzetten.</p>
    <button id="finish-decorating">Klaar!</button>
  </div>
</section>
